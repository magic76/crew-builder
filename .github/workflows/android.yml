name: Android
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Builder JavaScript
        run: |
          node --check forge.js
          node --check native-adapter.js
          node --check live-runtime.js
          node --check ui-runtime.js
          node --check builder-ux.js
          node --check builder-next.js
          node --check language-prompts.js
          node --check appspec-runtime.js
          node --check generated-app-hardening.js
          node --check build-experience.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crew-builder-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
